name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project PICSViewer.xcodeproj -scheme PICSViewer \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Make IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/PICSViewer.app Payload/
          zip -r PICSViewer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PICSViewer-ipa
          path: PICSViewer.ipa
